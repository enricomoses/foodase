<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88D168"/>
      <stop offset="40%" stop-color="#4C9C33"/>
      <stop offset="100%" stop-color="#1B5211"/>
    </linearGradient>
    <linearGradient id="leafHighlight" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#B2F092" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4C9C33" stop-opacity="0"/>
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#071905" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#leafShadow)">
    <!-- Daun Hijau Melengkung Alami -->
    <path d="M60 8 C95 30, 110 75, 85 118 C75 130, 60 135, 55 125 C45 105, 10 75, 25 35 C32 18, 48 8, 60 8 Z" fill="url(#leafGrad)"/>

    <!-- Pantulan Cahaya Atas Daun -->
    <path d="M58 12 C78 28, 90 55, 78 85 C65 60, 48 35, 58 12 Z" fill="url(#leafHighlight)"/>

    <!-- Tulang Daun Hijau Lembut -->
    <path d="M60 12 C62 45, 60 85, 56 125" stroke="#256B17" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M60 40 C72 45, 82 52, 86 58" stroke="#378A24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M59 62 C45 68, 35 76, 30 82" stroke="#378A24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M60 78 C70 82, 78 88, 80 94" stroke="#378A24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>

