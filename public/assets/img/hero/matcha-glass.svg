<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" fill="none">
  <defs>
    <!-- Gradien Teh Hijau Uji Matcha & Susu -->
    <linearGradient id="matchaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B7D26"/>
      <stop offset="35%" stop-color="#559938"/>
      <stop offset="65%" stop-color="#93C878"/>
      <stop offset="85%" stop-color="#E8F4E1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="matchaGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>

    <filter id="matchaShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-5" dy="25" stdDeviation="22" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#matchaShadow)" transform="rotate(-3 170 230)">
    <!-- Siluet Gelas -->
    <path d="M70 70 L95 400 C98 420, 242 420, 245 400 L270 70 Z" fill="url(#matchaLiquid)"/>

    <!-- Lapisan Kaca Transparan & Refleksi Pantulan -->
    <path d="M70 70 L95 400 C98 420, 242 420, 245 400 L270 70 Z" fill="url(#matchaGlass)"/>
    <path d="M78 80 L100 395" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <path d="M262 80 L240 395" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- Foam & Bubuk Matcha di Puncak Gelas -->
    <ellipse cx="170" cy="70" rx="100" ry="25" fill="#4B8C32" opacity="0.9"/>
    <ellipse cx="170" cy="70" rx="90" ry="20" fill="#6FB34E"/>
    <ellipse cx="170" cy="70" rx="100" ry="25" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

    <!-- Es Batu & Taburan Matcha -->
    <rect x="110" y="85" width="58" height="52" rx="10" transform="rotate(15 110 85)" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="175" y="105" width="52" height="48" rx="8" transform="rotate(-15 175 105)" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="150" cy="72" r="3" fill="#29591A"/>
    <circle cx="185" cy="68" r="2.5" fill="#29591A"/>
    <circle cx="165" cy="78" r="2" fill="#29591A"/>
  </g>
</svg>

