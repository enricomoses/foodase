<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F1F8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A5D4EC" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="iceFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88C7E6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#367C9E" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="iceRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55A4CC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#245A75" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E2F40" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#iceGlow)">
    <!-- Kubus Es 3D Isometric -->
    <path d="M60 15 L102 38 L60 62 L18 38 Z" fill="url(#iceTop)"/>
    <path d="M18 38 L60 62 L60 105 L18 80 Z" fill="url(#iceFront)"/>
    <path d="M60 62 L102 38 L102 80 L60 105 Z" fill="url(#iceRight)"/>

    <!-- Faset Pantulan & Gelembung Udara Internal -->
    <path d="M24 42 L58 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M60 18 L96 38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M60 65 L60 100" stroke="#C5E6F5" stroke-width="1.5" opacity="0.75"/>
    <circle cx="45" cy="55" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="75" cy="70" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>

